<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillBridge | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="signup-page">

    <!-- Navbar -->
    <nav class="navbar signup-navbar">
        <div class="logo">Skill<span>Bridge</span></div>
    </nav>


    <!-- Login -->
    <section class="signup-section">

        <div class="signup-card">

            <div class="signup-icon">✦</div>

            <h1>Welcome Back</h1>

            <p class="signup-subtitle">
                Login to continue your SkillBridge journey.
            </p>


            <form method="POST" action="/login">
            {% if error %}
                <div class="login-error">
                    {{ error }}
                 </div>
            {% endif %}
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)">
                            👁
                        </button>

                    </div>
                    <div class="forgot-password">
                        <a href="/forgot-password">Forgot Password?</a>
                    </div>
                </div>


                <!-- Login -->
                <button type="submit" class="primary-btn signup-submit">
                    Login →
                </button>

            </form>


            <div class="login-text">
                Don't have an account?
                <a href="/signup">Create Account</a>
            </div>

        </div>

    </section>


    <footer class="signup-footer">
        <p>© 2026 SkillBridge | BCA Minor Project</p>
    </footer>


    <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }

        }

    </script>

</body>
</html>
