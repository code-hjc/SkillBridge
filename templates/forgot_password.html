<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - SkillBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            background: #090914;
            color: white;
            font-family: "Times New Roman", serif;
        }

        .forgot-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at top right,
                rgba(109, 66, 199, 0.15),
                transparent 30%),
                #090914;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: rgba(18, 17, 33, 0.95);
            border: 1px solid #29253d;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
        }

        .forgot-card h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .forgot-card p {
            color: #aaa6b9;
            line-height: 1.5;
        }

        .error-message {
            margin: 15px 0;
            padding: 10px 12px;
            border: 1px solid #6b3045;
            border-radius: 8px;
            background: #2a1620;
            color: #ff9db5;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #aaa6b9;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            background: #0d0d19;
            border: 1px solid #29253d;
            border-radius: 9px;
            color: white;
            font-family: "Times New Roman", serif;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6d42c7;
            box-shadow: 0 0 0 3px rgba(109, 66, 199, 0.12);
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #6d42c7;
            color: white;
            font-family: "Times New Roman", serif;
            font-size: 15px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #7d4ddd;
        }

        .back-login {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #b9a7ff;
            text-decoration: none;
            font-size: 13px;
        }

        .back-login:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<section class="forgot-page">

    <div class="forgot-card">

        <h1>🔐 Reset Password</h1>

        <p>
            Enter your registered email and choose a new password.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required>
            </div>

            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>
            </div>

            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </form>

        <a href="/login" class="back-login">
            ← Back to Login
        </a>

    </div>

</section>

</body>
</html>
