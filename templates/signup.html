<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillBridge | Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="signup-page">

    <!-- Navbar -->
    <nav class="navbar signup-navbar">
        <div class="logo">Skill<span>Bridge</span></div>
    </nav>


    <!-- Signup -->
    <section class="signup-section">

        <div class="signup-card">

            <div class="signup-icon">✦</div>

            <h1>Create Your Account</h1>

            <p class="signup-subtitle">
                Start building your career with SkillBridge.
            </p>

            <form method="POST" action="/signup">
                {% if error %}
                <div class="signup-error">
                {{ error }}
                </div>
               {% endif %}

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)">
                            👁
                        </button>

                    </div>
                </div>


                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirm_password', this)">
                            👁
                        </button>

                    </div>
                </div>


                <!-- Create Account -->
                <button type="submit" class="primary-btn signup-submit">
                    Create Account →
                </button>

            </form>


            <div class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </div>

        </div>

    </section>


    <footer class="signup-footer">
        <p>© 2026 SkillBridge | BCA Minor Project</p>
    </footer>


    <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }

    </script>

</body>
</html>
